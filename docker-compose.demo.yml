version: '3.9'

services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
      target: backend
    container_name: greaterwms_demo_backend
    restart: unless-stopped
    privileged: true
    ports:
      - '8008:8008'
    environment:
      PYTHONUNBUFFERED: '1'
    volumes:
      - ./:/GreaterWMS/:rw
      - ./supervisord.conf:/etc/supervisor/supervisord.conf:ro

  frontend:
    build:
      context: ./
      dockerfile: Dockerfile
      target: front
    container_name: greaterwms_demo_frontend
    restart: unless-stopped
    privileged: true
    depends_on:
      - backend
    ports:
      - '8080:8080'
    volumes:
      - ./templates:/GreaterWMS/templates:rw
      - ./web_start.sh:/GreaterWMS/templates/web_start.sh:ro
